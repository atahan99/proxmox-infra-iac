# Properties of the physical box, so they apply in every ENV.

- name: Hardware | kernel command line (IOMMU, USB quirks for Coral + Seagate)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: ^GRUB_CMDLINE_LINUX_DEFAULT=
    line: GRUB_CMDLINE_LINUX_DEFAULT="{{ pve_kernel_cmdline }}"
  notify: Update grub # takes effect after the next reboot

- name: Hardware | iGPU driver + WireGuard at boot (guests cannot load modules; Kasm VPN egress needs WireGuard)
  ansible.builtin.copy:
    dest: /etc/modules-load.d/homelab.conf
    content: "i915\nwireguard\niTCO_wdt\n" # iTCO_wdt: the chipset watchdog systemd pings (below)
    mode: "0644"

# The Proxmox kernel boots with the performance governor, which holds every core at full clock (2.9 GHz)
# even idle, so the box sits at 80-90 °C and the fan never slows. powersave + balance_power still turbos
# under load. The governor first: intel_pstate refuses EPP changes while the governor is performance.
- name: Hardware | CPU power, idle-friendly (applied at boot and now)
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/homelab-cpu-power.conf
    content: |
      w /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor - - - - powersave
      w /sys/devices/system/cpu/cpu*/cpufreq/energy_performance_preference - - - - {{ pve_cpu_epp }}
    mode: "0644"
  notify: Apply CPU power

# A hard hang (the host freezes since 2026-10-21) stops systemd pinging the chipset watchdog, so the board
# resets itself after 30 s instead of waiting for a power-cycle. Not used by Proxmox: watchdog-mux only
# takes it with HA, which stays off here.
- name: Hardware | systemd drop-in folder
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    mode: "0755"

- name: Hardware | systemd pings the hardware watchdog
  ansible.builtin.copy:
    dest: /etc/systemd/system.conf.d/homelab-watchdog.conf
    content: |
      # Managed by Ansible (pve_host)
      [Manager]
      RuntimeWatchdogSec=30s
      RebootWatchdogSec=10min
    mode: "0644"
  notify: Reexec systemd

- name: Hardware | USB disk mounted at boot (nofail, so a missing disk cannot block boot)
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^UUID="?{{ pve_usb_disk_uuid }}"?\s'
    line: UUID={{ pve_usb_disk_uuid }} /mnt/external ext4 defaults,nofail 0 2

# And now, so the folders made later land on the disk, not under the mountpoint on the NVMe. Not through
# fstab: its nofail would hide a missing disk, which must fail the play here instead.
- name: Hardware | USB disk mounted now # noqa: command-instead-of-module (ansible.posix is not in CI)
  ansible.builtin.command: mount --mkdir -t ext4 UUID={{ pve_usb_disk_uuid }} /mnt/external
  when: ansible_facts['mounts'] | selectattr('mount', 'eq', '/mnt/external') | list | length == 0
  changed_when: true

- name: Hardware | webcam replug sync into docker-hw (lxc-video-sync)
  ansible.builtin.copy:
    src: "maintenance/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - {src: lxc-video-sync, dest: /usr/local/bin/lxc-video-sync, mode: "0755"}
    - {src: 99-lxc-video.rules, dest: /etc/udev/rules.d/99-lxc-video.rules, mode: "0644"}
  notify: Reload udev

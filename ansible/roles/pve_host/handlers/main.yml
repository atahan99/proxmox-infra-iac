- name: Reload network
  ansible.builtin.command: ifreload -a
  changed_when: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Update grub
  ansible.builtin.command: update-grub
  changed_when: true

- name: Reload udev
  ansible.builtin.command: udevadm control --reload
  changed_when: true

- name: Restart alloy
  ansible.builtin.systemd_service:
    name: alloy
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}" # the package is only simulated in check mode

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

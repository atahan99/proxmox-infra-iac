- name: Reload network
  ansible.builtin.command: ifreload -a
  changed_when: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Apply CPU power
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/homelab-cpu-power.conf
  changed_when: true

- name: Apply USB disk APM # reload first, so the trigger sees the new rule
  ansible.builtin.shell: udevadm control --reload && udevadm trigger --action=change --subsystem-match=block --sysname-match='sd[a-z]'
  changed_when: true

- name: Reexec systemd # reads system.conf.d (the watchdog) without a reboot
  ansible.builtin.systemd_service:
    daemon_reexec: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Update grub
  ansible.builtin.command: update-grub
  changed_when: true

- name: Reload udev
  ansible.builtin.command: udevadm control --reload
  changed_when: true

- name: Restart alloy
  ansible.builtin.systemd_service:
    name: alloy
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}" # the package is only simulated in check mode

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

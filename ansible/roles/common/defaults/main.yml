# stable = Debian point releases + security (Ubuntu: -security + -updates); security = security only (pbs)
common_updates: stable

# Beszel agent as a systemd service. Docker hosts run it as a container instead (it needs the
# Docker socket to see containers), so they set common_beszel: false.
common_beszel: true
common_beszel_version: "0.20.0"
common_beszel_sha256: f03b8ec7349a8133a0329ef50619bc3a97a7bb0a0e423866416ecc818cebc43c
common_beszel_port: 45876
# The hub's key pair lives in the vault: hub_pubkey here and in the agents' env, hub_key in the hub.
common_beszel_hub_key: "{{ lookup('pipe', 'pass-cli item view pass://Homelab/beszel/hub_pubkey') }}"

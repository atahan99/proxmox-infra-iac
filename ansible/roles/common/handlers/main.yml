# In check mode the units are only simulated, so restarting them can't succeed.
- name: Restart beszel-agent
  ansible.builtin.systemd_service:
    name: beszel-agent
    state: restarted
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

# A drop-in can't be checked with `validate:`, so check the whole config before the reload. Skipped in check mode.
- name: Reload ssh
  ansible.builtin.shell: sshd -t && systemctl try-reload-or-restart ssh
  changed_when: true

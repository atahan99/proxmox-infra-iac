# Secrets of the stacks on this host: core stacks (core_stacks_names) + the ones Dockhand deploys here
# (dockhand_config_stacks). Imported by main.yml, after it made /opt/secrets.
- name: Secrets | stacks on this host
  ansible.builtin.set_fact:
    core_stacks_on_host: "{{ core_stacks_names + dockhand_config_stacks | default([]) }}"

- name: Secrets | templates in the repo (stacks/<stack>/secrets/<file>.tpl)
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../../stacks"
    patterns: "*.tpl"
    recurse: true
  delegate_to: localhost
  check_mode: false
  register: core_stacks_templates

# On the Mac; the values reach the host only as file content. Templates replaced by a core_stacks_secrets
# entry, or of stacks this host doesn't run, are skipped.
- name: Secrets | templates filled in from Proton Pass (pass-cli inject)
  ansible.builtin.command: pass-cli inject -i {{ item }}
  loop: "{{ core_stacks_templates.files | map(attribute='path') | sort }}"
  when:
    - item | dirname | basename == 'secrets'
    - item | dirname | dirname | basename in core_stacks_on_host
    - (item | dirname | dirname | basename) ~ '/' ~ (item | basename | splitext | first) not in core_stacks_secrets
  delegate_to: localhost
  check_mode: false
  changed_when: false
  failed_when: false # reported below: no_log would hide pass-cli's error (which holds no secret)
  no_log: true
  register: core_stacks_injected

- name: Secrets | every template filled in
  ansible.builtin.assert:
    that: core_stacks_inject_failed | length == 0
    fail_msg: "{{ core_stacks_inject_failed | map(attribute='stderr') | list }}"
    quiet: true
  vars:
    core_stacks_inject_failed: "{{ core_stacks_injected.results | selectattr('rc', 'defined') | rejectattr('rc', 'eq', 0) | list }}"

# Compose expands `$` in env files (even in env_file), so `$` is written as `$$` there.
- name: Secrets | from templates (no diff output)
  ansible.builtin.copy:
    dest: "/opt/secrets/{{ item.item | basename | splitext | first }}"
    content: "{{ (item.stdout | replace('$', '$$')) if item.item.endswith('.env.tpl') else item.stdout }}\n"
    mode: "0600"
  loop: "{{ core_stacks_injected.results | selectattr('rc', 'defined') }}"
  loop_control:
    label: "{{ item.item | dirname | dirname | basename }}/{{ item.item | basename | splitext | first }}"
  diff: false
  no_log: true
  register: core_stacks_secrets_tpl_result

- name: Secrets | from core_stacks_secrets (no diff output)
  ansible.builtin.copy:
    dest: "/opt/secrets/{{ item.key | basename }}"
    # A mapping becomes an env file; a string is written as it is (certificates, config files).
    content: "{% if item.value is mapping %}{% for k, v in item.value.items() %}{{ k }}={{ v | replace('$', '$$') }}\n{% endfor %}{% else %}{{ item.value }}\n{% endif %}"
    mode: "0600"
  loop: "{{ core_stacks_secrets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.key.split('/')[0] in core_stacks_on_host
  diff: false
  no_log: true
  register: core_stacks_secrets_result

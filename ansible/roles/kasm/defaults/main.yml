# What every workspace shares (the registry's values); browsers also get their start commands.
kasm_workspace_defaults:
  image_type: Container
  enabled: true
  cores: 2
  memory_bytes: 2902458368 # the registry's 2768 MiB
  cpu_allocation_method: Inherit
  docker_registry: https://index.docker.io/v1/
  run_config: '{"hostname": "kasm"}' # JSON text, like the UI's field (create_image rejects an object)
  gpu_count: 0
  require_gpu: false
  gpu_graphics_acceleration: [MESA]
  gpu_video_encoding: [SW]
  x_res: 800
  y_res: 600
kasm_browser_exec_config:
  go: {cmd: "bash -c '/dockerstartup/custom_startup.sh --go --url \"$KASM_URL\"'"}
  assign: {cmd: "bash -c '/dockerstartup/custom_startup.sh --assign --url \"$KASM_URL\"'"}

# VPN egress: one WireGuard provider and gateway for the All Users group, so every workspace can pick it
# at launch. The gateway gets the vault note without its PrivateKey line; the key goes into the
# credential (Kasm adds it per session). {} turns it off.
kasm_egress:
  provider: proton-swiss
  gateway: {name: Swiss-VPN, country: Switzerland, city: Zurich}
  credential: proton-kasm-vpn
  group: All Users
  config: "{{ lookup('pipe', 'pass-cli item view pass://Homelab/kasm-vpn/note') | regex_replace('(?m)^PrivateKey\\s*=.*\\n', '') }}"
  private_key: "{{ lookup('pipe', 'pass-cli item view pass://Homelab/kasm-vpn/password') }}"

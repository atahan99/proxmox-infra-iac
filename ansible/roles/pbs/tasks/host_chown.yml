# An unprivileged CT 108 sees the datastore's uid/gid 34 (backup) as nobody; it needs host uid 100034.
# Only when the CT really is unprivileged, so it can never touch a datastore a privileged PBS uses.
- name: Host | is CT 108 unprivileged, and who owns the datastore
  ansible.builtin.shell: |
    set -o pipefail
    pct config {{ vmid }} | grep -c '^unprivileged: 1' || true
    stat -c %u /mnt/external/Backups/.chunks
  args:
    executable: /bin/bash
  delegate_to: pve
  register: pbs_host_owner
  changed_when: false
  check_mode: false

- name: Host | chown the datastore to 100034 (about 415k files, several minutes)
  ansible.builtin.command: chown -R 100034:100034 /mnt/external/Backups
  delegate_to: pve
  when: pbs_host_owner.stdout_lines == ['1', '34']
  changed_when: true
  async: 7200
  poll: 30

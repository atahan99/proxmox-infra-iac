# Idempotent: creates the admin only while Memos still asks for setup, the identity provider only when none
# is named Authelia, and closes sign-ups. Memos isn't published on the host: its container address is used.
- name: API | Memos' address (waits for Dockhand to deploy it)
  ansible.builtin.command: docker inspect memos -f '{{ "{{" }}(index .NetworkSettings.Networks "proxy").IPAddress{{ "}}" }}'
  register: memos_config_ip
  until: memos_config_ip.rc == 0 and memos_config_ip.stdout | length > 0
  retries: "{{ memos_config_wait_retries }}"
  delay: 10
  changed_when: false
  check_mode: false

- name: API | instance profile
  ansible.builtin.uri:
    url: "http://{{ memos_config_ip.stdout }}:5230/api/v1/instance/profile"
  register: memos_config_profile
  until: memos_config_profile.status == 200
  retries: 30
  delay: 5
  check_mode: false

- name: Setup | first account (an admin; Memos allows this only while no account exists)
  ansible.builtin.uri:
    url: "http://{{ memos_config_ip.stdout }}:5230/api/v1/users"
    method: POST
    body_format: json
    body: {username: "{{ memos_config_user }}", password: "{{ memos_config_password }}", role: ADMIN, state: NORMAL}
  when: memos_config_profile.json.needsSetup | default(false)
  changed_when: true
  no_log: true

- name: API | sign in
  ansible.builtin.uri:
    url: "http://{{ memos_config_ip.stdout }}:5230/api/v1/auth/signin"
    method: POST
    body_format: json
    body: {passwordCredentials: {username: "{{ memos_config_user }}", password: "{{ memos_config_password }}"}}
  register: memos_config_login
  no_log: true
  check_mode: false

- name: API | identity providers and general settings
  ansible.builtin.uri:
    url: "http://{{ memos_config_ip.stdout }}:5230/api/v1/{{ item }}"
    headers: {Authorization: "Bearer {{ memos_config_login.json.accessToken }}"}
  loop: [identity-providers, instance/settings/GENERAL]
  register: memos_config_state
  no_log: true
  check_mode: false

- name: SSO | OIDC client secret (generated by core_stacks)
  ansible.builtin.slurp:
    src: /opt/appdata/authelia/oidc/memos.secret
  register: memos_config_secret
  when: "'Authelia' not in (memos_config_state.results[0].json.identityProviders | default([]) | map(attribute='title'))"
  no_log: true

# Memos links an SSO login to an account only through a sign-in with the provider (it never matches by
# username), so the link itself is a one-time click: Settings -> My account -> Linked accounts.
- name: SSO | Authelia as identity provider ("Continue with Authelia")
  ansible.builtin.uri:
    url: "http://{{ memos_config_ip.stdout }}:5230/api/v1/identity-providers"
    method: POST
    headers: {Authorization: "Bearer {{ memos_config_login.json.accessToken }}"}
    body_format: json
    body:
      type: OAUTH2
      title: Authelia
      config:
        oauth2Config:
          clientId: memos
          clientSecret: "{{ memos_config_secret.content | b64decode | trim }}"
          authUrl: "https://auth.{{ memos_config_domain }}/api/oidc/authorization"
          tokenUrl: "https://auth.{{ memos_config_domain }}/api/oidc/token"
          userInfoUrl: "https://auth.{{ memos_config_domain }}/api/oidc/userinfo"
          scopes: [openid, profile, email]
          fieldMapping: {identifier: preferred_username, displayName: name, email: email}
  when: memos_config_secret is not skipped
  changed_when: true
  no_log: true

- name: Setup | close sign-ups
  ansible.builtin.uri:
    url: "http://{{ memos_config_ip.stdout }}:5230/api/v1/instance/settings/GENERAL?updateMask=disallow_user_registration"
    method: PATCH
    headers: {Authorization: "Bearer {{ memos_config_login.json.accessToken }}"}
    body_format: json
    body: {name: instance/settings/GENERAL, generalSetting: {disallowUserRegistration: true}}
  when: not (memos_config_state.results[1].json.generalSetting.disallowUserRegistration | default(false))
  changed_when: true
  no_log: true

- name: OIDC | wait for Calibre-Web's database (Dockhand deploys it)
  ansible.builtin.stat:
    path: "{{ calibre_config_db }}"
  register: calibre_config_db_stat
  until: calibre_config_db_stat.stat.exists
  retries: "{{ calibre_config_wait_retries }}"
  delay: 10

- name: OIDC | client secret (generated by core_stacks)
  ansible.builtin.slurp:
    src: /opt/appdata/authelia/oidc/calibre-web.secret
  register: calibre_config_secret
  no_log: true

- name: OIDC | helper
  ansible.builtin.copy:
    src: calibre-oidc
    dest: /usr/local/sbin/calibre-oidc
    mode: "0755"

- name: OIDC | Authelia login in app.db (generic OIDC, admins group -> admin)
  ansible.builtin.command: /usr/local/sbin/calibre-oidc
  args:
    stdin: "{{ {'db': calibre_config_db, 'issuer': calibre_config_issuer, 'secret': calibre_config_secret.content | b64decode | trim} | to_json }}"
  register: calibre_config_result
  changed_when: "'changed' in calibre_config_result.stdout"
  notify: Restart Calibre-Web
  no_log: true

# Restart now: a later role failing would skip an end-of-play handler, and later runs report "ok".
- name: OIDC | apply
  ansible.builtin.meta: flush_handlers

# Docker CE from Docker's own repo (Debian's docker.io lags behind). Updates: apt by hand (security ones are automatic).
- name: Repo | Docker signing key (checked against the pinned SHA-256)
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    checksum: "sha256:{{ docker_engine_keyring_sha256 }}"
    mode: "0644"

- name: Repo | Docker stable for this release
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: stable
      Signed-By: /etc/apt/keyrings/docker.asc
    mode: "0644"
  register: docker_engine_repo

- name: Packages
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    update_cache: "{{ docker_engine_repo is changed }}"
  ignore_errors: "{{ ansible_check_mode }}" # the repo is only simulated in check mode

# Bounded logs (the default json-file grows forever) for every container, without a setting per stack.
- name: Daemon | log rotation, no-new-privileges
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ {'log-driver': 'local', 'log-opts': {'max-size': '10m', 'max-file': '3'}, 'no-new-privileges': docker_engine_no_new_privileges} | to_nice_json }}\n"
    mode: "0644"
  notify: Restart docker

- name: Service
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"

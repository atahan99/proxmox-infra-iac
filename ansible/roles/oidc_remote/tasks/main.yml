- name: Secrets | OIDC client secrets (generated by core_stacks)
  ansible.builtin.slurp:
    src: /opt/appdata/authelia/oidc/{{ item }}.secret
  loop: "{{ oidc_remote_apps }}"
  register: oidc_remote_secrets
  no_log: true

- name: Secrets | by app
  ansible.builtin.set_fact:
    oidc_remote_secret: "{{ dict(oidc_remote_secrets.results | map(attribute='item') | zip(oidc_remote_secrets.results | map(attribute='content') | map('b64decode') | map('trim'))) }}"
  no_log: true

- name: App
  ansible.builtin.include_tasks: "{{ item }}.yml"
  loop: "{{ oidc_remote_apps }}"

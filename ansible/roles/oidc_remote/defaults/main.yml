# Authelia login for apps outside docker-apps. Their client secrets are generated here (core_stacks); each
# app gets its own copy, on its own host. Creates what's missing, never updates: change a realm by hand.
oidc_remote_apps: [proxmox, pbs, immich]
oidc_remote_issuer: https://auth.{{ core_stacks_domain }}
# Your Authelia username becomes <user>@authelia in Proxmox and PBS, with full admin rights.
oidc_remote_user: "{{ core_stacks_authelia_user }}"
oidc_remote_immich_url: http://{{ hostvars[groups['docker_hw'][0]].ansible_host }}:2283
oidc_remote_immich_key: "{{ lookup('pipe', 'pass-cli item view pass://Homelab/immich/api_key') }}"

# To-do lists. Login only through Authelia (OIDC); local accounts and sign-ups off, so the first OIDC
# login creates the user. SQLite and attachments in /opt/appdata/vikunja.
# Runs as root in the container: Docker creates the bind-mounted data folders as root.
name: vikunja
services:
  vikunja:
    image: vikunja/vikunja:2.7.0@sha256:e2204a1c1c6a81e833c2b3a5442be182ca2335b54c2e7e37578cc3fe12a27cfc
    container_name: vikunja
    restart: unless-stopped
    user: "0"
    env_file:
      - path: /opt/secrets/vikunja.env # VIKUNJA_SERVICE_SECRET
        required: false
      - path: /opt/secrets/oidc-vikunja.env # the OIDC client secret (generated by core_stacks)
        required: false
    environment:
      VIKUNJA_SERVICE_PUBLICURL: https://vikunja.${DOMAIN:?DOMAIN is set in the stack's .env}/
      VIKUNJA_SERVICE_TIMEZONE: ${TZ}
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      VIKUNJA_AUTH_LOCAL_ENABLED: "false"
      VIKUNJA_AUTH_OPENID_ENABLED: "true"
      VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHELIA_NAME: Authelia
      VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHELIA_AUTHURL: https://auth.${DOMAIN}
      VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHELIA_CLIENTID: vikunja
      VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHELIA_SCOPE: openid profile email
    volumes:
      - /opt/appdata/vikunja/db:/db
      - /opt/appdata/vikunja/files:/app/vikunja/files
    networks: [proxy] # also Authelia (auth.<domain> alias on Traefik)
    labels:
      traefik.enable: "true"
      traefik.http.routers.vikunja.rule: Host(`vikunja.${DOMAIN}`)
      traefik.http.routers.vikunja.middlewares: authelia@file
      traefik.http.services.vikunja.loadbalancer.server.port: "3456"

networks:
  proxy:
    external: true

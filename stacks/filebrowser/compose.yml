# Web file manager for the USB disk (/mnt/external; same path inside as outside, so share and
# bookmark paths match). Deliberately no /opt: that holds the app data and /opt/secrets.
# Config inline below (Compose fills in the domain); users in its database (database.db in its data
# folder). Login only through Authelia (OIDC): the first login creates the user, Authelia's admins group
# makes it an admin. Runs as uid 1000, so new files suit Samba; `filebrowser-init`
# hands it the data folder (Docker creates it as root).
name: filebrowser
services:
  filebrowser-init:
    image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    command: [chown, "1000:1000", /data]
    volumes:
      - /opt/appdata/filebrowser:/data
    network_mode: none

  filebrowser:
    image: gtstef/filebrowser:2.0.1-stable@sha256:2e3936caf7b12908f7d3ebb68ddfcea075cda5f732e4bd95beae6cfa529cbec7
    container_name: filebrowser
    restart: unless-stopped
    depends_on:
      filebrowser-init: {condition: service_completed_successfully}
    env_file:
      - path: /opt/secrets/filebrowser.env # FILEBROWSER_ADMIN_PASSWORD (only used to create the admin)
        required: false
      - path: /opt/secrets/oidc-filebrowser.env # the OIDC client secret (generated by core_stacks)
        required: false
    environment:
      TZ: ${TZ}
      FILEBROWSER_CONFIG: /config/config.yaml
    configs:
      - source: config
        target: /config/config.yaml
    volumes:
      - /opt/appdata/filebrowser:/home/filebrowser/data
      - /mnt/external:/host-mnt/external
    networks: [proxy] # also Authelia (auth.<domain> alias on Traefik)
    labels:
      traefik.enable: "true"
      traefik.http.routers.filebrowser.rule: Host(`filebrowser.${DOMAIN:?DOMAIN is set in the stack's .env}`)
      traefik.http.routers.filebrowser.middlewares: authelia@file
      traefik.http.services.filebrowser.loadbalancer.server.port: "80"

configs:
  config:
    content: |
      # File Browser Quantum. Only the USB disk: no /opt (app data, secrets).
      server:
        port: 80
        listen: 0.0.0.0
        database: /home/filebrowser/data/database.db
        cacheDir: /home/filebrowser/data/tmp
        sources:
          - path: /host-mnt
            name: Mounted Storage
            config:
              defaultEnabled: true
      auth:
        adminUsername: admin # password: FILEBROWSER_ADMIN_PASSWORD (vault), only for a new database
        methods:
          password:
            enabled: false # OIDC only: File Browser then sends you straight to Authelia
          oidc:
            enabled: true
            clientId: filebrowser
            issuerUrl: https://auth.${DOMAIN}
            scopes: openid email profile groups
            userIdentifier: preferred_username
            adminGroup: admins

networks:
  proxy:
    external: true

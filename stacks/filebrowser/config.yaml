# File Browser Quantum. Only the USB disk: no /opt (app data, secrets).
server:
  port: 80
  listen: 0.0.0.0
  database: /home/filebrowser/data/database.db
  cacheDir: /home/filebrowser/data/tmp
  sources:
    - path: /host-mnt
      name: Mounted Storage
      config:
        defaultEnabled: true
auth:
  adminUsername: admin # password: FILEBROWSER_ADMIN_PASSWORD (Proton Pass), only for a new database

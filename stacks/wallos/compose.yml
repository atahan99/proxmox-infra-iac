# Subscription tracker. Database and logos in its data; point its
# notifications at ntfy (homelab-personal) in the UI.
name: wallos
services:
  wallos:
    image: bellamy/wallos:5.10.4@sha256:78b73a32ae24bcca67d6f4b96ca76fe29ee8da5e8df1769df1e612a4e776c904
    container_name: wallos
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - /opt/appdata/wallos/db:/var/www/html/db
      - /opt/appdata/wallos/logos:/var/www/html/images/uploads/logos
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.wallos.rule: Host(`wallos.${DOMAIN:?DOMAIN is set in the stack's .env}`)
      traefik.http.routers.wallos.middlewares: authelia@file
      traefik.http.services.wallos.loadbalancer.server.port: "80"

networks:
  proxy:
    external: true

# Git server (pull mirrors of GitHub). One login: Authelia in front, Forgejo trusts its Remote-User header and
# creates the user on the first visit (reverse-proxy auth). Git over HTTPS and the API use Forgejo's own
# tokens, so those paths skip Authelia with the identity headers stripped. Git over SSH on
# port 2222. SQLite; secrets (SECRET_KEY, INTERNAL_TOKEN) are generated by Forgejo into its app.ini.
# The image keeps everything in /var/lib/gitea (uid 1000); the repositories and LFS (its git/ folder) are on the
# USB disk only.
name: forgejo
services:
  forgejo:
    image: code.forgejo.org/forgejo/forgejo:17.0.0@sha256:06d38310de496a10186d952bdad5ca764c153c8023ede8dfa0944c79a1dc5412
    container_name: forgejo
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__DOMAIN: forgejo.${DOMAIN:?DOMAIN is set in the stack's .env}
      FORGEJO__server__ROOT_URL: https://forgejo.${DOMAIN}/
      FORGEJO__server__SSH_DOMAIN: forgejo.${DOMAIN}
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__REVERSE_PROXY_AUTHENTICATION_USER: Remote-User
      FORGEJO__security__REVERSE_PROXY_AUTHENTICATION_EMAIL: Remote-Email
      FORGEJO__security__REVERSE_PROXY_AUTHENTICATION_FULL_NAME: Remote-Name
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: 10.250.0.0/29 # its own network: Traefik is the only other member
      FORGEJO__service__ENABLE_REVERSE_PROXY_AUTHENTICATION: "true"
      FORGEJO__service__ENABLE_REVERSE_PROXY_AUTO_REGISTRATION: "true"
      FORGEJO__service__ENABLE_REVERSE_PROXY_EMAIL: "true"
      FORGEJO__service__ENABLE_REVERSE_PROXY_FULL_NAME: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "false" # reverse-proxy registration needs it; Authelia gates it
      FORGEJO__service__SHOW_REGISTRATION_BUTTON: "false"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"
      FORGEJO__openid__ENABLE_OPENID_SIGNUP: "false"
    volumes:
      - /opt/appdata/forgejo:/var/lib/gitea # app.ini, SQLite, indexes
      - /mnt/external/Forgejo:/var/lib/gitea/git # repositories + LFS
    ports:
      - "2222:2222" # git over SSH (Forgejo's own SSH server, on SSH_PORT)
    networks: [forgejo] # own network: only Traefik can reach it (it trusts Remote-User)
    labels:
      traefik.enable: "true"
      traefik.docker.network: forgejo
      traefik.http.routers.forgejo.rule: Host(`forgejo.${DOMAIN}`)
      traefik.http.routers.forgejo.middlewares: authelia@file
      traefik.http.routers.forgejo-git.rule: >-
        Host(`forgejo.${DOMAIN}`) && (PathPrefix(`/api/`)
        || PathRegexp(`^/[^/]+/[^/]+(\.git)?/(info/refs|git-upload-pack|git-receive-pack|info/lfs)`))
      traefik.http.routers.forgejo-git.middlewares: forgejo-api@file,strip-identity@file # own tokens; no identity headers
      traefik.http.services.forgejo.loadbalancer.server.port: "3000"

  # Gitea Mirror: imports every repo on the GitHub account (new ones each hour) and creates a Forgejo pull mirror
  # for it; Forgejo then syncs each mirror itself. Same login as Forgejo (Authelia's Remote-User, first visit
  # creates the user), so it trusts that header and sits on its own network with only Traefik. It reaches
  # Forgejo's API through Traefik too (forgejo.<domain> is a Traefik alias there), never the forgejo network.
  gitea-mirror-init:
    image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    command: [chown, "1001:1001", /data] # the image's user; Docker creates the folder as root
    volumes:
      - /opt/appdata/gitea-mirror:/data
    network_mode: none

  gitea-mirror:
    image: ghcr.io/raylabshq/gitea-mirror:v3.40.3@sha256:786b193599c60138a3fa04b8d7abc45faef9748af030d49da802c5a478314154
    container_name: gitea-mirror
    restart: unless-stopped
    depends_on:
      gitea-mirror-init: {condition: service_completed_successfully}
    env_file:
      - path: /opt/secrets/forgejo-mirror.env # GITHUB_USERNAME, GITHUB_TOKEN, GITEA_USERNAME, GITEA_TOKEN
        required: false
    environment:
      BETTER_AUTH_URL: https://gitea-mirror.${DOMAIN} # its session secrets are generated into /app/data
      BETTER_AUTH_TRUSTED_ORIGINS: https://gitea-mirror.${DOMAIN}
      HEADER_AUTH_ENABLED: "true"
      HEADER_AUTH_USER_HEADER: Remote-User
      HEADER_AUTH_EMAIL_HEADER: Remote-Email
      HEADER_AUTH_NAME_HEADER: Remote-Name
      HEADER_AUTH_AUTO_PROVISION: "true"
      DESTINATION_PROVIDER: forgejo
      GITEA_URL: https://forgejo.${DOMAIN}
      PRIVATE_REPOSITORIES: "true"
      INCLUDE_COLLABORATOR_REPOS: "false" # own repos only, all under your Forgejo user
      SKIP_FORKS: "true"
      MIRROR_RELEASES: "true"
      SCHEDULE_ENABLED: "true" # import and mirror everything at start, then every SCHEDULE_INTERVAL
      SCHEDULE_INTERVAL: "3600"
      AUTO_MIRROR_REPOS: "true" # new GitHub repos get a mirror without a click
      CLEANUP_DELETE_IF_NOT_IN_GITHUB: "false" # a backup: a repo deleted on GitHub stays in Forgejo
    volumes:
      - /opt/appdata/gitea-mirror:/app/data
    networks: [gitea-mirror] # own network: only Traefik can reach it (it trusts Remote-User)
    labels:
      traefik.enable: "true"
      traefik.docker.network: gitea-mirror
      traefik.http.routers.gitea-mirror.rule: Host(`gitea-mirror.${DOMAIN}`)
      traefik.http.routers.gitea-mirror.middlewares: authelia@file
      traefik.http.services.gitea-mirror.loadbalancer.server.port: "4321"

networks:
  forgejo:
    external: true
  gitea-mirror:
    external: true

# Git server (GitHub mirrors set up in its UI). One login: Authelia in front, Forgejo trusts its Remote-User header and
# creates the user on the first visit (reverse-proxy auth). Git over HTTPS and the API use Forgejo's own
# tokens, so those paths skip Authelia with the identity headers stripped (`api-bypass`). Git over SSH on
# port 2222. SQLite; secrets (SECRET_KEY, INTERNAL_TOKEN) are generated by Forgejo into its app.ini.
name: forgejo
services:
  forgejo:
    image: code.forgejo.org/forgejo/forgejo:16.0.5@sha256:5effb7305584aca479b29fde6f9631a6dbe86ae798ae02eeea33a3666f0c0bf8
    container_name: forgejo
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__DOMAIN: forgejo.${DOMAIN:?DOMAIN is set in the stack's .env}
      FORGEJO__server__ROOT_URL: https://forgejo.${DOMAIN}/
      FORGEJO__server__SSH_DOMAIN: forgejo.${DOMAIN}
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__REVERSE_PROXY_AUTHENTICATION_USER: Remote-User
      FORGEJO__security__REVERSE_PROXY_AUTHENTICATION_EMAIL: Remote-Email
      FORGEJO__security__REVERSE_PROXY_AUTHENTICATION_FULL_NAME: Remote-Name
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: 10.250.0.0/29 # its own network: Traefik is the only other member
      FORGEJO__service__ENABLE_REVERSE_PROXY_AUTHENTICATION: "true"
      FORGEJO__service__ENABLE_REVERSE_PROXY_AUTO_REGISTRATION: "true"
      FORGEJO__service__ENABLE_REVERSE_PROXY_EMAIL: "true"
      FORGEJO__service__ENABLE_REVERSE_PROXY_FULL_NAME: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "false" # reverse-proxy registration needs it; Authelia gates it
      FORGEJO__service__SHOW_REGISTRATION_BUTTON: "false"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"
      FORGEJO__openid__ENABLE_OPENID_SIGNUP: "false"
    volumes:
      - /opt/appdata/forgejo:/data
    ports:
      - "2222:2222" # git over SSH (Forgejo's own SSH server, on SSH_PORT)
    networks: [forgejo] # own network: only Traefik can reach it (it trusts Remote-User)
    labels:
      traefik.enable: "true"
      traefik.docker.network: forgejo
      traefik.http.routers.forgejo.rule: Host(`forgejo.${DOMAIN}`)
      traefik.http.routers.forgejo.middlewares: authelia@file
      traefik.http.routers.forgejo-git.rule: >-
        Host(`forgejo.${DOMAIN}`) && (PathPrefix(`/api/`)
        || PathRegexp(`^/[^/]+/[^/]+(\.git)?/(info/refs|git-upload-pack|git-receive-pack|info/lfs)`))
      traefik.http.routers.forgejo-git.middlewares: api-bypass@file # own tokens; no identity headers
      traefik.http.services.forgejo.loadbalancer.server.port: "3000"

networks:
  forgejo:
    external: true

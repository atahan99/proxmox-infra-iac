# RustDesk server: ID/rendezvous (hbbs) and relay (hbbr). No web UI. Clients trust the server's key pair
# (id_ed25519 in hbbs' data); a rebuild makes a new pair, and every client needs the new public key.
# Ports published on the LAN (clients away from home come in over Tailscale).
name: rustdesk
services:
  hbbs:
    image: rustdesk/rustdesk-server:1.1.16@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00
    container_name: hbbs
    restart: unless-stopped
    command: [hbbs]
    depends_on: [hbbr]
    volumes:
      - /opt/appdata/rustdesk/hbbs:/root
    ports:
      - "21115:21115" # NAT type test
      - "21116:21116" # ID registration, hole punching
      - "21116:21116/udp"
      - "21118:21118" # web clients
    networks: [rustdesk]

  hbbr:
    image: rustdesk/rustdesk-server:1.1.16@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00
    container_name: hbbr
    restart: unless-stopped
    command: [hbbr]
    volumes:
      - /opt/appdata/rustdesk/hbbr:/root
    ports:
      - "21117:21117" # relay
      - "21119:21119" # web clients
    networks: [rustdesk]

networks:
  rustdesk:

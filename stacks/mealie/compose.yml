# Recipes. SQLite (Mealie's default; the database is a file in /app/data).
# Login through Authelia (OIDC): the first login creates the user, or takes over the account with Authelia's
# email; Authelia's admins group makes it an admin. The password form is hidden, though the API still takes
# the fallback password (vault `mealie`). Homepage uses an API key.
name: mealie
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.28.0@sha256:8b02290f4d1806f02acac6f25f6d48a3c965612fda1f8e914d5af533276f8688
    container_name: mealie
    restart: unless-stopped
    env_file:
      - path: /opt/secrets/oidc-mealie.env # the OIDC client secret (generated by core_stacks)
        required: false
    environment:
      TZ: ${TZ}
      BASE_URL: https://mealie.${DOMAIN:?DOMAIN is set in the stack's .env}
      ALLOW_SIGNUP: "false"
      OIDC_AUTH_ENABLED: "true"
      OIDC_SIGNUP_ENABLED: "true"
      OIDC_CONFIGURATION_URL: https://auth.${DOMAIN}/.well-known/openid-configuration
      OIDC_CLIENT_ID: mealie
      OIDC_PROVIDER_NAME: Authelia
      OIDC_ADMIN_GROUP: admins
      OIDC_AUTO_REDIRECT: "true"
      ALLOW_PASSWORD_LOGIN: "false" # hides the form only
      OIDC_REMEMBER_ME: "true"
    volumes:
      - /opt/appdata/mealie:/app/data
    networks: [proxy] # also Authelia (auth.<domain> alias on Traefik)
    labels:
      traefik.enable: "true"
      traefik.http.routers.mealie.rule: Host(`mealie.${DOMAIN}`)
      traefik.http.routers.mealie.middlewares: authelia@file
      traefik.http.services.mealie.loadbalancer.server.port: "9000"

networks:
  proxy:
    external: true

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]

  # Proxmox host + every guest, through the read-only API token.
  - job_name: pve
    metrics_path: /pve
    params:
      cluster: ["1"]
      node: ["1"]
    static_configs: [{targets: ["pve"]}] # extra_hosts on pve-exporter
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "pve-exporter:9221"}

  - job_name: adguard
    static_configs: [{targets: ["adguard-exporter:9618"]}]

  - job_name: qbittorrent
    static_configs: [{targets: ["qbittorrent-exporter:8090"]}]

  - job_name: traefik
    static_configs: [{targets: ["traefik:8080"]}]

  - job_name: loki
    static_configs: [{targets: ["loki:3100"]}]

  - job_name: alloy
    static_configs: [{targets: ["alloy:12345"]}]

  - job_name: grafana
    static_configs: [{targets: ["grafana:3000"]}]

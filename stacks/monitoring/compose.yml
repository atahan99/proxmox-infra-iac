# Metrics and logs for the whole server. Prometheus (30 days) with exporters for Proxmox, AdGuard and
# qBittorrent; Loki (30 days) fed by Alloy (this host's containers and journal here; the Proxmox host and
# docker-hw push through Traefik); Grafana (Authelia OIDC login, alerts to ntfy). Config lives in the
# folders next to this file, data in /opt/appdata/monitoring.
# Secrets: secrets/*.tpl (Proton Pass) and Grafana's OIDC client secret (/opt/secrets/oidc-grafana.env,
# generated on the host by core_stacks).
# Prometheus, Grafana and Loki run as root in their containers: Docker creates the bind-mounted data
# folders as root (unprivileged LXC, so that root is an unprivileged uid on the Proxmox host).
name: monitoring
services:
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: prometheus
    restart: unless-stopped
    user: "0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.external-url=https://prometheus.${DOMAIN:?DOMAIN is set in the stack's .env}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/appdata/monitoring/prometheus:/prometheus
    mem_limit: 1g
    networks: [monitoring] # not on proxy: only Traefik and Homepage join this network from outside
    labels:
      traefik.enable: "true"
      traefik.docker.network: monitoring
      traefik.http.routers.prometheus.rule: Host(`prometheus.${DOMAIN}`)
      traefik.http.routers.prometheus.middlewares: authelia@file
      traefik.http.services.prometheus.loadbalancer.server.port: "9090"

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: grafana
    restart: unless-stopped
    user: "0"
    env_file:
      - path: /opt/secrets/monitoring-grafana.env # admin login (Homepage widget, break-glass), ntfy token
        required: false
      - path: /opt/secrets/oidc-grafana.env # GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
        required: false
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Login through Authelia (OIDC); Traefik puts Authelia in front as well, like every app.
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Authelia
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email groups
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.${DOMAIN}/api/oidc/authorization
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://auth.${DOMAIN}/api/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://auth.${DOMAIN}/api/oidc/userinfo
      GF_AUTH_GENERIC_OAUTH_AUTH_STYLE: InParams # client_secret_post, as set in Authelia
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
      - /opt/appdata/monitoring/grafana:/var/lib/grafana
    networks: [monitoring, proxy] # proxy: Authelia (auth.<domain> alias on Traefik) and ntfy
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: Host(`grafana.${DOMAIN}`)
      traefik.http.routers.grafana.middlewares: authelia@file
      traefik.http.services.grafana.loadbalancer.server.port: "3000"

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    container_name: loki
    restart: unless-stopped
    user: "0"
    command: [-config.file=/etc/loki/config.yml]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - /opt/appdata/monitoring/loki:/loki
    mem_limit: 1g
    networks: [monitoring]
    # Only the push API, and only for the other log senders (Proxmox host, docker-hw). No other route.
    labels:
      traefik.enable: "true"
      traefik.docker.network: monitoring
      traefik.http.routers.loki-push.rule: >-
        Host(`loki.${DOMAIN}`) && Path(`/loki/api/v1/push`)
        && (ClientIP(`${PVE_IP}`) || ClientIP(`${DOCKER_HW_IP}`))
      traefik.http.services.loki.loadbalancer.server.port: "3100"

  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /opt/appdata/monitoring/alloy:/var/lib/alloy/data # read positions, so a restart doesn't resend
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    networks: [monitoring, socket-proxy] # container logs through the read-only socket proxy

  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.10.1@sha256:5678b230735a80816755dc8b5e0fb139a6595e1d4271ace2d22ff82983d1bdf1
    container_name: pve-exporter
    restart: unless-stopped
    env_file:
      - path: /opt/secrets/monitoring-pve-exporter.env # PVE_TOKEN_VALUE
        required: false
    environment:
      # Read-only token (PVEAuditor), user and ACLs from pve_host; the token itself is made by hand.
      PVE_USER: monitoring@pve
      PVE_TOKEN_NAME: exporter
      PVE_VERIFY_SSL: "false" # ponytail: Proxmox's self-signed cert; verify once the API cert is fixed
    extra_hosts: ["pve:${PVE_IP}"] # prometheus.yml's target (Prometheus can't read env)
    networks: [monitoring]

  adguard-exporter:
    image: ghcr.io/henrywhitaker3/adguard-exporter:v1.2.1@sha256:42a9581bae4a91e6d4985415d1fe89ab9b1f50fbe2945a1c122d212d6354b747
    container_name: adguard-exporter
    restart: unless-stopped
    env_file:
      - path: /opt/secrets/monitoring-adguard-exporter.env # ADGUARD_USERNAMES, ADGUARD_PASSWORDS
        required: false
    environment:
      ADGUARD_SERVERS: http://${ADGUARD_IP},http://${RPI3_IP} # CT 106, RPi3 (same order as the logins)
    networks: [monitoring]

  qbittorrent-exporter:
    image: ghcr.io/martabal/qbittorrent-exporter:v2.0.3@sha256:bc4fa09481634ee894ebfb4d47c8aa239a32a12567b043afa01fa42a3075d1a5
    container_name: qbittorrent-exporter
    restart: unless-stopped
    env_file:
      - path: /opt/secrets/monitoring-qbittorrent-exporter.env # QBITTORRENT_API_KEY (qBittorrent 5.2+ wants a key, not a login)
        required: false
    environment:
      QBITTORRENT_BASE_URL: http://gluetun:8080 # vpn-services: qBittorrent lives in gluetun's network
    networks: [monitoring, proxy]

networks:
  monitoring:
    external: true # created by Ansible; Traefik (routes, scrapes) and Homepage (widget) join it
  proxy:
    external: true
  socket-proxy:
    external: true

# Website change and price tracker. Watches and notification settings live in its data;
# point its notifications at ntfy (homelab-personal) in the UI.
name: changedetection
services:
  changedetection:
    image: lscr.io/linuxserver/changedetection.io:0.60.8@sha256:91a1670814112dfe910bd2dbf33fc92b856978e077024fd378923b0bf5b29343
    container_name: changedetection
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      BASE_URL: https://changedetection.${DOMAIN:?DOMAIN is set in the stack's .env}
    volumes:
      - /opt/appdata/changedetection:/config
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.changedetection.rule: Host(`changedetection.${DOMAIN}`)
      traefik.http.routers.changedetection.middlewares: authelia@file
      traefik.http.services.changedetection.loadbalancer.server.port: "5000"

networks:
  proxy:
    external: true

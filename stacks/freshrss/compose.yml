# RSS reader. Feeds, users and the API password live in its data.
# One login: Authelia in front, FreshRSS trusts its Remote-User header (auth type "HTTP", set once with
# `./cli/reconfigure.php --auth-type http_auth`, kept in its data) from its own network only.
# Its API (/api, used by phone RSS apps and the Homepage widget) has its own login, so it skips Authelia.
name: freshrss
services:
  freshrss:
    image: lscr.io/linuxserver/freshrss:1.30.4@sha256:33bc296f96a82e40b05b174a550c6f77587029286f3343911106341a1a275f94
    container_name: freshrss
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      TRUSTED_PROXY: 10.250.0.8/29 # the freshrss network: Traefik is the only other member
    volumes:
      - /opt/appdata/freshrss:/config
    networks: [freshrss, proxy] # proxy: Homepage's widget (API password, no header trust)
    labels:
      traefik.enable: "true"
      traefik.docker.network: freshrss
      traefik.http.routers.freshrss.rule: Host(`freshrss.${DOMAIN:?DOMAIN is set in the stack's .env}`)
      traefik.http.routers.freshrss.middlewares: authelia@file
      traefik.http.routers.freshrss-api.rule: Host(`freshrss.${DOMAIN}`) && PathPrefix(`/api`)
      traefik.http.routers.freshrss-api.middlewares: api-bypass@file # own login; no identity headers
      traefik.http.services.freshrss.loadbalancer.server.port: "80"

networks:
  freshrss:
    external: true
  proxy:
    external: true

# Daily internet speed test over the plain line (the VPN one is in vpn-services). APP_KEY encrypts
# data in its database: never change it.
name: speedtest-tracker
services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:1.15.1@sha256:14d56d7c4ff0af18f0a09be8494352ba40d23196e78c5f812cee69afaa1edc45
    container_name: speedtest-tracker
    restart: unless-stopped
    env_file:
      - path: /opt/secrets/speedtest-tracker.env # APP_KEY, ADMIN_EMAIL, ADMIN_PASSWORD
        required: false
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      ADMIN_NAME: Admin
      APP_URL: https://speedtest.${DOMAIN:?DOMAIN is set in the stack's .env}
      ASSET_URL: https://speedtest.${DOMAIN}
      APP_TIMEZONE: ${TZ}
      DISPLAY_TIMEZONE: ${TZ}
      DB_CONNECTION: sqlite
      SPEEDTEST_SCHEDULE: "0 23 * * *" # daily at 23:00 (the VPN one runs at midnight)
    volumes:
      - /opt/appdata/speedtest-tracker:/config
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.speedtest.rule: Host(`speedtest.${DOMAIN}`)
      traefik.http.routers.speedtest.middlewares: authelia@file
      traefik.http.services.speedtest.loadbalancer.server.port: "80"

networks:
  proxy:
    external: true

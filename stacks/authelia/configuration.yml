# No secrets here: they come from /opt/secrets/authelia.env (AUTHELIA_* variables) and, for OIDC,
# from files Ansible generates on the host (/opt/appdata/authelia/oidc = /data/oidc).
server:
  address: tcp://:9091
  # Forward-auth checks only the session cookie. By default it also reads the Authorization header as
  # Authelia credentials, and apps that send their own token there (Beszel/PocketBase, Vikunja) then get
  # a 401 with a Basic-auth challenge: the browser's sign-in box instead of the app.
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth
        authn_strategies:
          - name: CookieSession
log:
  level: info
theme: auto
totp:
  issuer: '{{ env "DOMAIN" }}'
authentication_backend:
  file:
    path: /data/users.yml
    password:
      algorithm: argon2
access_control:
  default_policy: two_factor
session:
  cookies:
    - domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://auth.{{ env "DOMAIN" }}'
      default_redirection_url: 'https://homepage.{{ env "DOMAIN" }}'
storage:
  local:
    path: /data/db.sqlite3
notifier:
  # Single user: one-time links (2FA setup, resets) are written here; read them with
  # `docker exec authelia cat /data/notification.txt`.
  filesystem:
    filename: /data/notification.txt
identity_providers:
  oidc:
    hmac_secret: '{{ secret "/data/oidc/hmac" }}'
    jwks:
      # Authelia template: the PEM key as an indented block
      # yamllint disable-line rule:braces
      - key: {{ secret "/data/oidc/jwks.pem" | mindent 10 "|" | msquote }}
    # One login for the apps that speak OIDC (the rest sit behind the forward-auth middleware).
    clients:
      - client_id: dockhand
        client_name: Dockhand
        client_secret: '{{ secret "/data/oidc/dockhand.digest" }}'
        public: false
        authorization_policy: two_factor
        consent_mode: implicit # first-party app: no "allow Dockhand?" screen
        token_endpoint_auth_method: client_secret_post
        redirect_uris:
          - 'https://dockhand.{{ env "DOMAIN" }}/api/auth/oidc/callback'
        scopes: [openid, profile, email, groups]
      - client_id: grafana
        client_name: Grafana
        client_secret: '{{ secret "/data/oidc/grafana.digest" }}'
        public: false
        authorization_policy: two_factor
        consent_mode: implicit
        require_pkce: true
        pkce_challenge_method: S256
        token_endpoint_auth_method: client_secret_post
        redirect_uris:
          - 'https://grafana.{{ env "DOMAIN" }}/login/generic_oauth'
        scopes: [openid, profile, email, groups]
      - client_id: vikunja
        client_name: Vikunja
        client_secret: '{{ secret "/data/oidc/vikunja.digest" }}'
        public: false
        authorization_policy: two_factor
        consent_mode: implicit
        token_endpoint_auth_method: client_secret_basic
        redirect_uris:
          - 'https://vikunja.{{ env "DOMAIN" }}/auth/openid/authelia'
        scopes: [openid, profile, email]
      - client_id: mealie
        client_name: Mealie
        client_secret: '{{ secret "/data/oidc/mealie.digest" }}'
        public: false
        authorization_policy: two_factor
        consent_mode: implicit
        require_pkce: true
        pkce_challenge_method: S256
        token_endpoint_auth_method: client_secret_basic
        redirect_uris:
          - 'https://mealie.{{ env "DOMAIN" }}/login'
        scopes: [openid, profile, email, groups]
      - client_id: memos
        client_name: Memos
        client_secret: '{{ secret "/data/oidc/memos.digest" }}'
        public: false
        authorization_policy: two_factor
        consent_mode: implicit
        token_endpoint_auth_method: client_secret_basic # Memos tries basic first (post only as a fallback)
        redirect_uris:
          - 'https://memos.{{ env "DOMAIN" }}/auth/callback'
        scopes: [openid, profile, email]
      - client_id: filebrowser
        client_name: File Browser
        client_secret: '{{ secret "/data/oidc/filebrowser.digest" }}'
        public: false
        authorization_policy: two_factor
        consent_mode: implicit
        token_endpoint_auth_method: client_secret_basic
        redirect_uris:
          - 'https://filebrowser.{{ env "DOMAIN" }}/api/auth/oidc/callback'
        scopes: [openid, profile, email, groups]
      - client_id: calibre-web
        client_name: Calibre-Web
        client_secret: '{{ secret "/data/oidc/calibre-web.digest" }}'
        public: false
        authorization_policy: two_factor
        consent_mode: implicit
        token_endpoint_auth_method: client_secret_basic
        redirect_uris:
          - 'https://books.{{ env "DOMAIN" }}/login/generic/authorized'
        scopes: [openid, profile, email, groups]

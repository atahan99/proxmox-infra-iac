# VS Code in the browser. Login: Authelia only (no password of its own). Runs as uid 1000 with its own
# workspace in /opt/appdata/code-server; deliberately no access to the rest of /opt (that holds
# /opt/secrets). Settings and extensions live in that workspace.
name: code-server
services:
  code-server:
    image: lscr.io/linuxserver/code-server:4.140.0@sha256:c84b35f6238af058e3543e2e9c0532c4d3d3902ef11effea3ed90e4ec293d46d
    container_name: code-server
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      DEFAULT_WORKSPACE: /config/workspace
    volumes:
      - /opt/appdata/code-server:/config
    networks: [code-server] # own network: only Traefik can reach it (no login of its own)
    labels:
      traefik.enable: "true"
      traefik.docker.network: code-server
      traefik.http.routers.code-server.rule: Host(`code-server.${DOMAIN:?DOMAIN is set in the stack's .env}`)
      traefik.http.routers.code-server.middlewares: authelia@file
      traefik.http.services.code-server.loadbalancer.server.port: "8443"

networks:
  code-server:
    external: true

name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: 8.30.1
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: 0.76.2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu
          tofu_version: 1.13.2
          tofu_wrapper: false
      - name: Install gitleaks, trivy, yamllint, ansible-lint, actionlint, zizmor (pinned in requirements-ci.txt)
        run: |
          cd /tmp
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tgz"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tgz\$" | sha256sum -c -
          sudo tar -xzf "$tgz" -C /usr/local/bin gitleaks
          # straight from GitHub releases: setup-trivy downloads via get.trivy.dev, which went away 2026-11-03
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tgz="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfLO "$base/$tgz"
          curl -sSfL "$base/trivy_${TRIVY_VERSION}_checksums.txt" | grep " $tgz\$" | sha256sum -c -
          sudo tar -xzf "$tgz" -C /usr/local/bin trivy
          pip install -r "$GITHUB_WORKSPACE/requirements-ci.txt"
      - run: make lint
        env:
          GH_TOKEN: ${{ github.token }} # zizmor's online audits (impostor commits, vulnerable actions)
      - name: Pinned download hashes match their releases (a Renovate bump fails here until the hash is updated)
        run: |
          f=ansible/roles/common/defaults/main.yml
          v=$(sed -n 's/^common_beszel_version: "\(.*\)"$/\1/p' $f)
          pin=$(sed -n 's/^common_beszel_sha256: //p' $f)
          want=$(curl -sSfL "https://github.com/henrygd/beszel/releases/download/v$v/beszel_${v}_checksums.txt" \
            | awk '$2 == "beszel-agent_linux_amd64.tar.gz" {print $1}')
          if [ -z "$want" ] || [ "$pin" != "$want" ]; then echo "common_beszel_sha256 for $v should be $want"; exit 1; fi
      - run: make ha-check
